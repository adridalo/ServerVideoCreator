name: Build ServerVideoCreator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Print Python search paths (for debugging)
        run: |
          python -c "import sys; print('Python search paths:', sys.path)"

      - name: Show file structure (debug)
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%
          dir /b

      - name: Build executable with PYTHONPATH set
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%
          set PYTHONPATH=%CD%
          pyinstaller --noconfirm --onefile --name ServerVideoCreator --paths=%CD% main.py
          copy ffmpeg.exe dist\
          copy proxy.config.json dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ github.run_number }}
          path: dist\
