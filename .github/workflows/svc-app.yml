name: Build executable

on: 
  push:
    branches: [ main ]
  
jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify required files exist
      run: |
        if not exist ffmpeg.exe (exit 1)
        if not exist proxy.config.json (exit 1)
        if not exist main.py (exit 1)

    - name: Copy required files into build folder
      run: |
        mkdir build_assets
        copy ffmpeg.exe build_assets\
        copy proxy.config.json build_assets\

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --add-data "build_assets\\ffmpeg.exe;." --add-data "build_assets\\proxy.config.json;." main.py

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Build_${{ format('{0:02d}', github.run_number) }}
        path: dist/main.exe