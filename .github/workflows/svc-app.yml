name: Build Python Tkinter App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🛠️ Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --name ServerVideoCreator main.py

      - name: 📁 Prepare Final Build Folder
        run: |
          $buildNumber = "${{ github.run_number }}"
          $packageDir = "package"
          New-Item -ItemType Directory -Path $packageDir | Out-Null

          Copy-Item "dist/ServerVideoCreator.exe" "$packageDir/ServerVideoCreator.exe"
          Copy-Item "ffmpeg.exe" "$packageDir/ffmpeg.exe"
          Copy-Item "proxy.config.json" "$packageDir/proxy.config.json"

          Compress-Archive -Path "$packageDir/*" -DestinationPath "Build_$buildNumber.zip"
        shell: pwsh

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ github.run_number }}
          path: Build_${{ github.run_number }}.zip
