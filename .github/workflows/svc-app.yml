name: Build and Package Tkinter App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package with PyInstaller
        run: |
          pyinstaller --name ServerVideoCreator main.py

      - name: Copy extra files
        run: |
          copy ffmpeg.exe dist\main\
          copy proxy.config.json dist\main\

      - name: Zip packaged app as Build_xx
        run: |
          $buildNumber = "${{ github.run_number }}"
          Compress-Archive -Path dist\main\* -DestinationPath dist\Build_$buildNumber.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ github.run_number }}
          path: dist/Build_${{ github.run_number }}.zip
